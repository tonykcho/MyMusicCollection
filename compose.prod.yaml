services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: MyMusicCollection
    ports:
      - 5432
    volumes:
      - music_postgres_data:/var/lib/postgresql
    networks:
      - music-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  music-api:
    image: ghcr.io/tonykcho/music-api:latest
    ports:
      - 5550
    environment:
      - ASPNETCORE_URLS=http://+:5550
    depends_on:
      postgres:
        condition: service_healthy
      music-api-migrate:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      #- "traefik.http.routers.music-api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.music-api.rule=Host(`tonykcho.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.music-api.entrypoints=websecure"
      - "traefik.http.services.music-api.loadbalancer.server.port=5550"
      - "traefik.docker.network=music-network"
      - "traefik.http.routers.music-api.tls=true"
      - "traefik.http.routers.music-api.tls.certresolver=letsencrypt"
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - music-network
      - otlp-network
    volumes:
      - music_api_images:/app/uploads
    restart: unless-stopped

  music-api-migrate:
    image: ghcr.io/tonykcho/music-api-migrate:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=${POSTGRES_HOST:-postgres};Database=MyMusicCollection;User Id=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};
    networks:
      - music-network
    labels:
      - "traefik.enable=false"
      - "com.centurylinklabs.watchtower.enable=true"

  music-ui:
    image: ghcr.io/tonykcho/music-ui:latest
    ports:
      - 5501
    depends_on:
      - music-api
    environment:
      - PORT=5501
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.music-ui.rule=Host(`tonykcho.com`)"
      # - "traefik.http.routers.music-ui.rule=PathPrefix(`/`)"
      - "traefik.http.routers.music-ui.entrypoints=websecure"
      - "traefik.http.routers.music-ui.tls=true"
      - "traefik.http.routers.music-ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.music-ui.loadbalancer.server.port=5501"
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
    networks:
      - music-network

  traefik:
    image: traefik:v3.6.4
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker"
      - "--log.level=DEBUG"
      # Standard web entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Custom entrypoints
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      #- "--entrypoints.music-api.address=:5550"
      #- "--entrypoints.music-ui.address=:5501"
      - "--entrypoints.grafana.address=:3000"
      - "--entrypoints.jaeger.address=:16686"

      # Access log configuration
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/access.log"

      # Let's Encrypt configuration
      - "--certificatesResolvers.letsencrypt.acme.email=tonykcho3527657@gmail.com"
      - "--certificatesResolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesResolvers.letsencrypt.acme.dnsChallenge=true"
      - "--certificatesResolvers.letsencrypt.acme.dnsChallenge.provider=cloudflare"

      - "--certificatesResolvers.letsencrypt.acme.dnsChallenge.resolvers=1.1.1.1:5"
    ports:
      - "80:80" # The HTTP port
      - "443:443" # The HTTPS port
      - "8080:8080" # Dashboard
      # - "5501:5501" # Music UI
      # - "5550:5550" # Music API
      - "3000:3000" # Grafana
      - "16686:16686" # Jaeger
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "./traefik-logs:/var/log" # Mount a directory for log files
      - "./acme.json:/acme.json"
    restart: unless-stopped
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    networks:
      - music-network

  watchtower:
    image: containrrr/watchtower
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 300
    restart: unless-stopped
    networks:
      - music-network

volumes:
  music_postgres_data:
  music_api_images:


networks:
  music-network:
    name: music-network
    driver: bridge
  otlp-network:
    external: true
